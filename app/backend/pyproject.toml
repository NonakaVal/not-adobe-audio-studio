[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "podcast-studio"
version = "0.1.0"
description = "Local transcription-based audio and video editor"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
transcription = ["faster-whisper>=1.1,<2", "av>=11,<17"]
test = ["httpx>=0.27,<1", "pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
py-modules = ["main", "edl", "enhance", "media", "transcription"]

[workspace]
members = [
    "crates/studio-core",
    "crates/studio-jobs",
    "crates/studio-import",
    "crates/studio-store",
    "crates/studio-app",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.92"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
